<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>VideoParty</title>
    <script src="https://cdn.tailwindcss.com"></script>
<base target="_blank">
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen p-4">

    <h1 class="text-4xl font-bold mb-8 text-blue-400">VideoParty</h1>

    <!-- Сообщение об ошибке -->
    {% if error %}
    <div class="bg-red-500 text-white px-4 py-2 rounded mb-4 w-full max-w-md text-center">
        {{ error }}
    </div>
    {% endif %}

    <div class="bg-gray-800 p-6 rounded-xl shadow-2xl w-full max-w-md">
        <!-- Вкладки -->
        <div class="flex border-b border-gray-700 mb-6">
            <button id="tab-create" onclick="switchTab('create')" class="flex-1 py-2 font-semibold text-blue-400 border-b-2 border-blue-400 transition-colors">
                Создать комнату
            </button>
            <button id="tab-join" onclick="switchTab('join')" class="flex-1 py-2 font-semibold text-gray-400 border-b-2 border-transparent transition-colors hover:text-white">
                Присоединиться
            </button>
        </div>

        <!-- Форма: Создать -->
        <form id="form-create" action="/create_chat" method="post" class="flex flex-col gap-4">
            <div>
                <label class="block text-sm text-gray-400 mb-1">Ваше имя</label>
                <input type="text" name="username" required
                       class="w-full p-2 bg-gray-700 border border-gray-600 rounded text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">ID комнаты (придумайте)</label>
                <input type="text" name="room_id" required
                       class="w-full p-2 bg-gray-700 border border-gray-600 rounded text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">Ссылка на YouTube, VK Видео или Rutube</label>
                <input type="url" name="video_url" required placeholder="https://youtube.com/watch?v=... или https://vkvideo.ru/video-..."
                       class="w-full p-2 bg-gray-700 border border-gray-600 rounded text-white focus:outline-none focus:border-blue-500">
            </div>
            <button type="submit" class="mt-2 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition-colors">
                Создать и войти
            </button>
        </form>

        <!-- Форма: Присоединиться (скрыта по умолчанию) -->
        <form id="form-join" action="/join_chat" method="post" class="hidden flex-col gap-4">
            <div>
                <label class="block text-sm text-gray-400 mb-1">Ваше имя</label>
                <input type="text" name="username" required
                       class="w-full p-2 bg-gray-700 border border-gray-600 rounded text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">ID комнаты</label>
                <input type="text" name="room_id" required
                       class="w-full p-2 bg-gray-700 border border-gray-600 rounded text-white focus:outline-none focus:border-blue-500">
            </div>
            <button type="submit" class="mt-2 w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded transition-colors">
                Войти
            </button>
        </form>
    </div>

    <script>
        function switchTab(tab) {
            const formCreate = document.getElementById('form-create');
            const formJoin = document.getElementById('form-join');
            const btnCreate = document.getElementById('tab-create');
            const btnJoin = document.getElementById('tab-join');

            if (tab === 'create') {
                formCreate.classList.remove('hidden');
                formCreate.classList.add('flex');
                formJoin.classList.add('hidden');
                formJoin.classList.remove('flex');

                btnCreate.className = "flex-1 py-2 font-semibold text-blue-400 border-b-2 border-blue-400 transition-colors";
                btnJoin.className = "flex-1 py-2 font-semibold text-gray-400 border-b-2 border-transparent transition-colors hover:text-white";
            } else {
                formJoin.classList.remove('hidden');
                formJoin.classList.add('flex');
                formCreate.classList.add('hidden');
                formCreate.classList.remove('flex');

                btnJoin.className = "flex-1 py-2 font-semibold text-blue-400 border-b-2 border-blue-400 transition-colors";
                btnCreate.className = "flex-1 py-2 font-semibold text-gray-400 border-b-2 border-transparent transition-colors hover:text-white";
            }
        }
    </script>
</body>
</html>
